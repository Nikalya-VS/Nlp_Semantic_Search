services:

  # ==========================================
  # FASTAPI BACKEND
  # ==========================================

  backend:

    build:
      context: .
      dockerfile: Dockerfile

    container_name: semantic-search-backend

    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

    restart: unless-stopped


  # ==========================================
  # STREAMLIT FRONTEND
  # ==========================================

  frontend:

    build:
      context: .
      dockerfile: Dockerfile

    container_name: semantic-search-frontend

    command:
      [
        "streamlit",
        "run",
        "frontend/app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501"
      ]

    ports:
      - "8501:8501"

    env_file:
      - .env

    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

    depends_on:
      - backend

    restart: unless-stopped